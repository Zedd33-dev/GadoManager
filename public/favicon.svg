<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#1f3a2e"/>
  <!-- Horns: two simple curves, bold enough to read at 16px. -->
  <path d="M6 13c-2-3-1-7 2-8 2 3 1 6-1 9" fill="#ffffff"/>
  <path d="M26 13c2-3 1-7-2-8-2 3-1 6 1 9" fill="#ffffff"/>
  <!-- Ears -->
  <ellipse cx="9" cy="15" rx="2.6" ry="1.8" fill="#ffffff"/>
  <ellipse cx="23" cy="15" rx="2.6" ry="1.8" fill="#ffffff"/>
  <!-- Head -->
  <path d="M16 12c5 0 8.5 3.4 8.5 8.2 0 4.6-3.7 7.3-8.5 7.3s-8.5-2.7-8.5-7.3C7.5 15.4 11 12 16 12z" fill="#ffffff"/>
  <!-- Muzzle shading and nostrils, drawn in the brand colour so they read as
       detail rather than a second flat shape competing with the head. -->
  <ellipse cx="16" cy="23.5" rx="5.4" ry="3.6" fill="#1f3a2e"/>
  <ellipse cx="13.8" cy="23.6" rx="0.9" ry="1.3" fill="#ffffff"/>
  <ellipse cx="18.2" cy="23.6" rx="0.9" ry="1.3" fill="#ffffff"/>
</svg>
